[project]
name = "landfall"
version = "0.1.0"
description = "Your international launch team. Find where your brand belongs worldwide."
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "strands-agents>=1.0",
    "boto3>=1.35",
    "pydantic>=2.8",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "playwright>=1.47"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
asyncio_mode = "auto"
